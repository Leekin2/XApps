plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'io.github.leekin2.xapps'
    compileSdk { version = release(37) }
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'io.github.leekin2.xapps'
        minSdk 35
        targetSdk 36
        versionCode rootProject.ext.xappsVersionCode
        versionName rootProject.ext.xappsVersionName
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release { signingConfig signingConfigs.debug; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { compose true; buildConfig true }
    packaging { resources { excludes += ['META-INF/LICENSE*','META-INF/NOTICE*','META-INF/AL2.0','META-INF/LGPL2.1'] } }
}
dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation project(':common')
    implementation project(':xgoogle')
    implementation project(':xsecurity')
    implementation project(':xnotify')
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.12.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha28'
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference:0.9.4'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
}
